name: CD - Clean Data

on:
  push:
    branches: [main]
    paths:
      - "data/raw/orders.csv"
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Needed to commit cleaned file

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Remove duplicates
        run: python remove_duplicates.py

      - name: Commit cleaned data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/orders.csv data/logs/audit.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-clean: remove duplicates from orders.csv"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orders-clean
          path: data/processed/orders.csv